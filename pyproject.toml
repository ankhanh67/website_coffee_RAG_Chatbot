[project]
name = "website-coffee-mas"
version = "0.1.0"
description = "Multi-Agent LLM system (API-first, Neo4j Aura Graph RAG) for website_coffee"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "httpx2>=2.0",
    "neo4j>=5.20",
    "redis>=5.0",
    "pandas>=2.2",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "watchdog>=4.0",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

